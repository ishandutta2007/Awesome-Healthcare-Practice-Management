<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#102a43"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00b4d8"/><stop offset="50%" stop-color="#06d6a0"/><stop offset="100%" stop-color="#48cae4"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="60%" stop-color="#e0fbfc"/><stop offset="100%" stop-color="#90e0ef"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1b3a5b" stroke-width=".7" d="M 40 0 L 0 0 0 40" opacity=".35"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow-soft" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(-15px,10px);opacity:.6}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(20px,-15px);opacity:.55}}@keyframes ecgScroll{0%{stroke-dashoffset:1200}}@keyframes floatCross{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(3deg)}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb2 10s ease-in-out infinite;transform-origin:1000px 300px}.ecg-line{stroke-dasharray:1200;animation:ecgScroll 5s linear infinite}.medical-cross{animation:floatCross 6s ease-in-out infinite;transform-origin:1060px 140px}.pill-item{animation:floatPill 5s ease-in-out infinite}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="200" cy="90" r="140" fill="#0077b6" class="orb-1" filter="url(#glow-soft)"/><circle cx="1020" cy="310" r="160" fill="#06d6a0" class="orb-2" filter="url(#glow-soft)"/><path fill="none" stroke="#00b4d8" stroke-width="2.5" d="M 0 350 L 320 350 L 340 330 L 355 375 L 375 285 L 395 390 L 415 335 L 430 350 L 750 350 L 770 330 L 785 375 L 805 285 L 825 390 L 845 335 L 860 350 L 1200 350" class="ecg-line" filter="url(#glow)" opacity=".3"/><g class="medical-cross" opacity=".25"><circle cx="1060" cy="140" r="60" fill="#1e3a5f" stroke="#00b4d8" stroke-width="2"/><path stroke="#06d6a0" stroke-linecap="round" stroke-width="8" d="M 1045 140 L 1075 140 M 1060 125 L 1060 155"/></g><g transform="translate(80, 52)"><rect width="270" height="32" fill="#1b2a4a" stroke="#00b4d8" stroke-width="1.2" opacity=".9" rx="16"/><circle cx="18" cy="16" r="5" fill="#06d6a0" filter="url(#glow)"/><text x="32" y="21" fill="#90e0ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CURATED HEALTHCARE ECOSYSTEM</text></g><text x="80" y="140" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-.5">Awesome Healthcare Practice Management</text><text x="80" y="185" fill="#a0aec0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">EHR / EMR Platforms • Medical Billing &amp; Scheduling • Self-Hosted Clinical Systems</text><rect width="850" height="2" x="80" y="215" fill="url(#accentGrad)" opacity=".8"/><g><g class="pill-item" transform="translate(80, 245)"><rect width="180" height="40" x="0" y="0" fill="#132238" stroke="#2a4365" stroke-width="1.2" rx="8"/><text x="18" y="25" fill="#64dfdf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🛡️ ONC &amp; HIPAA Ready</text></g><g class="pill-item" transform="translate(80, 245) translate(195, 0)"><rect width="190" height="40" x="0" y="0" fill="#132238" stroke="#2a4365" stroke-width="1.2" rx="8"/><text x="18" y="25" fill="#48cae4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">🏥 Open Source &amp; SaaS</text></g><g class="pill-item" transform="translate(80, 245) translate(400, 0)"><rect width="175" height="40" x="0" y="0" fill="#132238" stroke="#2a4365" stroke-width="1.2" rx="8"/><text x="18" y="25" fill="#72efdd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">⚡ FHIR &amp; HL7 APIs</text></g><g class="pill-item" transform="translate(80, 245) translate(590, 0)"><rect width="190" height="40" x="0" y="0" fill="#132238" stroke="#2a4365" stroke-width="1.2" rx="8"/><text x="18" y="25" fill="#80ffdb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">💳 Billing &amp; Scheduling</text></g></g><text x="80" y="325" fill="#718096" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">Comprehensive directory comparing leading SaaS solutions and verified open-source digital health repositories.</text></svg>